<!DOCTYPE html>
<!--
    index.html
    ----------
    Static frontend (HTML + vanilla JS, no build step) for Ticket Bridge
    configuration and auditing. Deliberately simple: this project is an
    internal integration service, not an end-user application, so a
    framework/bundler isn't warranted.

    Three tabs:
      - Systems: list/create/edit federated systems.
      - Conversations: browse conversations and each participant's status.
      - Audit: browse the event log (audit_log).
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Bridge — Configuration and Audit</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Ticket Bridge</h1>
        <p class="subtitle">Ticket correlation between support systems</p>
    </header>

    <nav class="tabs">
        <button class="tab-btn active" data-tab="systems">Systems</button>
        <button class="tab-btn" data-tab="conversations">Conversations</button>
        <button class="tab-btn" data-tab="audit">Audit</button>
    </nav>

    <main>
        <!-- ================= SYSTEMS ================= -->
        <section id="tab-systems" class="tab-panel active">
            <div class="panel-header">
                <h2>Federated Systems</h2>
                <button id="btn-new-system" class="btn-primary">+ New system</button>
            </div>
            <table id="table-systems">
                <thead>
                    <tr>
                        <th>Code</th><th>Name</th><th>Base URL</th>
                        <th>Auth</th><th>Active</th><th>Updated</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <dialog id="dialog-system">
                <form id="form-system" method="dialog">
                    <h3>System configuration</h3>
                    <label>Code (immutable after creation)
                        <input type="text" name="code" required placeholder="e.g. system_c">
                    </label>
                    <label>Name
                        <input type="text" name="name" required placeholder="e.g. Team X Helpdesk">
                    </label>
                    <label>Base URL (system's webhook endpoint)
                        <input type="url" name="base_url" required placeholder="https://.../webhook">
                    </label>
                    <label>Authentication type
                        <select name="auth_type">
                            <option value="api_key">API Key (header)</option>
                            <option value="bearer">Bearer Token</option>
                            <option value="basic">Basic Auth</option>
                        </select>
                    </label>
                    <label>Secret reference (name in Secret Manager / env var)
                        <input type="text" name="secret_ref" placeholder="e.g. system_c_outbound_key">
                    </label>
                    <label>Status mapping (JSON: internal → external)
                        <textarea name="status_mapping" rows="5" placeholder='{"new": "Open", "resolved": "Resolved"}'></textarea>
                    </label>
                    <label>Payload template (JSON, with {external_ref}, {mapped_status}, {conversation_id})
                        <textarea name="payload_template" rows="4" placeholder='{"id": "{external_ref}", "status": "{mapped_status}"}'></textarea>
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" name="active" checked> Active
                    </label>
                    <div class="dialog-actions">
                        <button type="button" id="btn-cancel-system">Cancel</button>
                        <button type="submit" class="btn-primary">Save</button>
                    </div>
                </form>
            </dialog>
        </section>

        <!-- ================= CONVERSATIONS ================= -->
        <section id="tab-conversations" class="tab-panel">
            <div class="panel-header">
                <h2>Conversations</h2>
                <label>Filter by system:
                    <select id="filter-conversations-system">
                        <option value="">All</option>
                    </select>
                </label>
            </div>
            <table id="table-conversations">
                <thead>
                    <tr>
                        <th>ID</th><th>Subject</th><th>Overall status</th>
                        <th>Participants</th><th>Updated</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <!-- ================= AUDIT ================= -->
        <section id="tab-audit" class="tab-panel">
            <div class="panel-header">
                <h2>Audit Log</h2>
                <label>Filter by system:
                    <select id="filter-audit-system">
                        <option value="">All</option>
                    </select>
                </label>
            </div>
            <table id="table-audit">
                <thead>
                    <tr>
                        <th>Date/Time</th><th>Event type</th><th>System</th>
                        <th>Conversation</th><th>Detail</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <footer>
        <span id="connection-status"></span>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
