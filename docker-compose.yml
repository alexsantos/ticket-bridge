# docker-compose.yml
# ------------------
# Local/dev stack: the app plus its one real dependency, Postgres (see
# CLAUDE.md Decision 2 - no broker, the `outbox` table on this same
# Postgres instance is the queue). `db`'s init scripts are the project's
# own numbered migrations, mounted read-only into
# /docker-entrypoint-initdb.d - the official postgres image runs every
# *.sql file there, in filename order, on first startup against an empty
# data volume. That order (001_initial_schema, 002_seed_example,
# 003_standardize_ticket_status, 004_unify_auth_mechanism,
# 005_admin_authentication, 006_stored_outbound_secrets,
# 007_retire_secret_ref) is exactly the
# sequence README.md section 3.2
# has you run by hand, so `docker compose up` reproduces it automatically
# - seed data (002) included, since this is a local/dev stack (005's
# seeded admin account is NOT dev-only - see README.md section 5 for its
# default credentials and why they need changing immediately). To start
# empty, remove migrations/002_seed_example.sql from the mount (or delete
# the db_data volume and re-mount without it) before first startup.
#
# This does not replace README.md sections 4-6 (Cloud Run / GCP deployment,
# Secret Manager) - it's the equivalent of README.md section 3 (local dev)
# in one command.
#
# `db` publishes no host port on purpose - it's reachable only from `app`
# over the `ticket-bridge` network, by service name (`db:5432`). This
# matters on a server that already runs other Postgres containers/instances
# on 5432: there's no host port to collide with, and nothing outside this
# compose project's own network can reach this database directly.
#
# `app` reads its configuration from `.env` (`env_file:` below) - the same
# file local dev uses (README.md section 3.2 step 5: `cp .env.example
# .env`), so there's exactly one place to set SECRETS_ENCRYPTION_KEY,
# ROOT_PATH, etc. regardless of how you run this. The one exception is
# DATABASE_URL, overridden below on purpose: .env's copy points at
# `localhost`, correct for a Postgres running directly on the host, but
# meaningless inside this container - `db` is this compose stack's own
# Postgres, reachable only by its service name on the `ticket-bridge`
# network.

networks:
  ticket-bridge:

# Settings shared by simulator-a and simulator-b (merged in with <<:).
x-simulator: &simulator
  profiles: ["simulator"]
  image: ghcr.io/alexsantos/ticket-bridge-simulator:latest
  build: ./simulator
  depends_on:
    - app

services:
  db:
    image: postgres:17-alpine
    environment:
      # Must match the credentials embedded in .env's DATABASE_URL - see
      # the `app` service's DATABASE_URL override below.
      POSTGRES_DB: ticketbridge
      POSTGRES_USER: ticketbridge
      POSTGRES_PASSWORD: ticketbridge
    networks:
      - ticket-bridge
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbridge -d ticketbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Published by .github/workflows/docker-publish.yml on every push to
    # main (tag: latest) and on version tags (tag: X.Y.Z) - see README.md
    # section 7. Pin to a specific X.Y.Z tag instead of `latest` for
    # anything beyond local/dev use.
    image: ghcr.io/alexsantos/ticket-bridge:latest
    ports:
      - "8080:8080"
    networks:
      - ticket-bridge
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ticketbridge:ticketbridge@db:5432/ticketbridge
    depends_on:
      db:
        condition: service_healthy

  # Optional stand-in external systems for testing (simulator/README.md):
  # two independent simulators, so you can play both sides of a
  # conversation. Only started with the profile:
  #   docker compose --profile simulator pull
  #   docker compose --profile simulator up -d
  # Published by .github/workflows/docker-publish.yml alongside the bridge
  # (same tags). `build:` is only used by `up --build`, from a repo
  # checkout. Ports are bound to 127.0.0.1 only: the simulator UI has no
  # login, so reach it through an SSH tunnel on a shared VM. The bridge
  # delivers to them over the compose network at
  # http://simulator-a:8090/webhook and http://simulator-b:8090/webhook.
  simulator-a:
    <<: *simulator
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      ticket-bridge:
        # Its name before 0.8.1, so a system registered in the bridge with
        # Base URL http://simulator:8090/webhook keeps receiving deliveries.
        aliases: [simulator]
    environment:
      SIM_BRIDGE_URL: http://app:8080
      SIM_SYSTEM_CODE: simulator_a
      SIM_REF_PREFIX: SIMA
    volumes:
      # Same volume as before the rename, so existing tickets and saved
      # config are kept.
      - simulator_data:/data

  simulator-b:
    <<: *simulator
    ports:
      - "127.0.0.1:8091:8090"
    networks:
      - ticket-bridge
    environment:
      SIM_BRIDGE_URL: http://app:8080
      SIM_SYSTEM_CODE: simulator_b
      SIM_REF_PREFIX: SIMB
    volumes:
      - simulator_b_data:/data

volumes:
  db_data:
  simulator_data:
  simulator_b_data:
