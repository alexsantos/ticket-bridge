[project]
name = "ticket-bridge"
version = "0.12.0"
description = "Ticket correlation service across multiple support applications."
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.50.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "psycopg[binary,pool]==3.3.4",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "apscheduler==3.11.3",
    "bcrypt==5.0.0",
    "cryptography==49.0.0",
]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# CI fails below this - see .github/workflows/tests.yml.
fail_under = 80
show_missing = true
skip_covered = true
