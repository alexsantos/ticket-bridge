[project]
name = "ticket-bridge"
version = "0.4.0"
description = "Ticket correlation service across multiple support applications."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.50.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "psycopg[binary,pool]==3.3.4",
    "httpx==0.28.1",
    "google-cloud-secret-manager==2.29.0",
    "python-multipart==0.0.32",
    "apscheduler==3.11.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
