[project]
name = "ticket-bridge-simulator"
version = "0.1.0"
description = "Stand-in external support system for exercising Ticket Bridge end to end."
license = "MIT"
requires-python = ">=3.14"
# Same pins as the bridge (../pyproject.toml), but a separate project on
# purpose: the simulator talks to the bridge only over HTTP, like any real
# integrating system, and never imports from app/.
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.50.2",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sim"]

[tool.coverage.report]
# CI fails below this - see ../.github/workflows/tests.yml.
fail_under = 80
show_missing = true
skip_covered = true
