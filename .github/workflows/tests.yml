name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Integration tests (tests/conftest.py) create one database per test on
    # this server - see TEST_DATABASE_URL below.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (pinned in .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests with coverage (fails below 80% - pyproject.toml)
        run: uv run pytest --cov -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (pinned in simulator/.python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests with coverage (fails below 80% - simulator/pyproject.toml)
        run: uv run pytest --cov -v
